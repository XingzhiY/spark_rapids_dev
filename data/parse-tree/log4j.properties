# 设置根日志记录器，级别为INFO，并将日志输出到 info_file 和 warn_file 两个地方
log4j.rootCategory=INFO, info_file, warn_file

# --- 配置 INFO 日志文件 ---
# 定义一个名为 info_file 的 appender (输出目的地)，类型为滚动文件
log4j.appender.info_file=org.apache.log4j.RollingFileAppender
# 指定 INFO 日志的文件名
log4j.appender.info_file.File=spark_info.log
# 设置日志格式
log4j.appender.info_file.layout=org.apache.log4j.PatternLayout
log4j.appender.info_file.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n
# 添加过滤器，只记录 INFO 级别的日志
log4j.appender.info_file.filter.1=org.apache.log4j.varia.LevelMatchFilter
log4j.appender.info_file.filter.1.LevelToMatch=INFO
log4j.appender.info_file.filter.1.AcceptOnMatch=true
log4j.appender.info_file.filter.2=org.apache.log4j.varia.DenyAllFilter

# --- 配置 WARN 及更高级别日志文件 ---
# 定义一个名为 warn_file 的 appender
log4j.appender.warn_file=org.apache.log4j.RollingFileAppender
# 指定 WARN 日志的文件名
log4j.appender.warn_file.File=spark_warn.log
# 设置此 appender 的阈值，只记录 WARN 及以上级别 (WARN, ERROR, FATAL) 的日志
log4j.appender.warn_file.Threshold=WARN
# 设置日志格式
log4j.appender.warn_file.layout=org.apache.log4j.PatternLayout
log4j.appender.warn_file.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n